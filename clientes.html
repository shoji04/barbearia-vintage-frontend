<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>THE GENTLEMEN'S CLUB 300</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.jpg" alt="The Gentlemen's Club 300 Barber Shop" class="logo logo-header" />
    <nav>
      <a href="clientes.html">Clientes</a>
      <a href="agenda.html">Agenda</a>
      <span id="saudacao-funcionario" class="saudacao"></span>
      <button onclick="logout()">Sair</button>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2 id="titulo-form">Novo cliente</h2>
      <input type="hidden" id="cliente-id" />
      <div class="form-row">
        <input type="text" id="nome" placeholder="Nome" />
        <input type="email" id="email" placeholder="E-mail" />
      </div>
      <input type="text" id="observacoes" placeholder="Observações (opcional)" />
      <p class="erro" id="erro" style="display: none"></p>
      <button class="btn-primary" onclick="salvarCliente()">Salvar cliente</button>
    </div>

    <div class="card">
      <h2>Clientes cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-clientes"></tbody>
      </table>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="clientes.js"></script>
  <script>
    mostrarSaudacaoFuncionario();
    marcarLinkAtivo();
  </script>
</body>
</html>
