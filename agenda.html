<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE GENTLEMEN'S CLUB 300</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="escrita.jpg" alt="The Gentlemen's Club 300 Barber Shop" class="logo logo-escrita" />
    <nav>
      <a href="clientes.html">Clientes</a>
      <a href="agenda.html">Agenda</a>
      <span id="saudacao-funcionario" class="saudacao"></span>
      <button onclick="logout()">Sair</button>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Novo agendamento</h2>
      <div class="form-row">
        <select id="cliente_id"></select>
        <input type="text" id="servico" placeholder="Serviço (ex: Corte, Barba)" />
      </div>
      <div class="form-row form-row-data-horario">
        <div class="campo">
          <label for="data">Data</label>
          <input type="date" id="data" />
        </div>
        <div class="campo">
          <label for="horario">Horário</label>
          <input type="time" id="horario" />
        </div>
      </div>
      <p class="erro" id="erro" style="display: none"></p>
      <button class="btn-primary" onclick="criarAgendamento()">Agendar</button>
    </div>

    <div class="card">
      <h2>Agenda</h2>
      <div class="filtros">
        <label>Filtrar por data:</label>
        <input type="date" id="filtro-data" onchange="carregarAgendamentos()" />
        <button onclick="limparFiltro()">Ver todos</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Horário</th>
            <th>Cliente</th>
            <th>Serviço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-agenda"></tbody>
      </table>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="agenda.js"></script>
  <script>
    mostrarSaudacaoFuncionario();
    marcarLinkAtivo();
  </script>
</body>
</html>
